<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀스택 연결 테스트</title>
<style>
  body{font-family:"Malgun Gothic",sans-serif;max-width:560px;margin:40px auto;padding:0 16px}
  input,button{font-size:1rem;padding:8px}
  li{margin:4px 0} .ok{color:#0a7} .err{color:#c33}
</style>
</head>
<body>
<h1>풀스택 연결 테스트</h1>
<p>API 주소: <input id="api" size="34" value="http://localhost:8000"></p>
<p>서버 상태: <b id="health">확인 중...</b></p>
<form id="form"><input id="name" placeholder="저장할 이름" required> <button>추가</button></form>
<p id="msg"></p>
<ul id="list"></ul>
<script>
const $ = id => document.getElementById(id);
const api = () => $("api").value.replace(/\/$/, "");
async function health(){
  try{ const r = await fetch(api()+"/health"); $("health").textContent = (await r.json()).status; $("health").className="ok"; }
  catch{ $("health").textContent = "연결 실패"; $("health").className="err"; }
}
async function load(){
  const r = await fetch(api()+"/items");
  const d = await r.json();
  if(!r.ok){ $("msg").textContent = d.detail; $("msg").className="err"; return; }
  $("msg").textContent = "";
  $("list").innerHTML = d.map(i => `<li>#${i.id} ${i.name.replace(/</g,"&lt;")}</li>`).join("");
}
$("form").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch(api()+"/items", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:$("name").value})});
  if(!r.ok){ $("msg").textContent = (await r.json()).detail; $("msg").className="err"; return; }
  $("name").value=""; load();
};
$("api").onchange = () => { health(); load(); };
health(); load();
</script>
</body>
</html>
