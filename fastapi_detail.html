<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI · Supabase · Railway 동작 원리</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --ink:#1c2733; --sub:#5d6c7b; --line:#d0d9e2;
    --code:#0f1720; --codeink:#d6e2ee; --hl:#2f80ed40; --pkt:#8e44ad; --ok:#27ae60; --err:#e5484d;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f151b; --card:#18212a; --ink:#e7eef5; --sub:#97a8b8; --line:#2c3a47; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:22px 14px 60px}
  .wrap{max-width:1080px;margin:auto}
  h1{font-size:1.6rem}
  .lead{color:var(--sub);margin:4px 0 16px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:20px;cursor:pointer;font:inherit;font-size:.9rem}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab.e{border-color:var(--err)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}

  .stage{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 18px;padding:10px 4px 16px}
  .node{flex:1 1 118px;max-width:150px;border:2px solid var(--c);border-radius:14px;padding:10px 6px;text-align:center;background:var(--card);transition:box-shadow .3s,transform .3s;position:relative;z-index:1}
  .node.act{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent);transform:scale(1.05)}
  .node.pulse{animation:pulse .9s ease 2}
  @keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--c) 25%,transparent)}}
  .node .i{font-size:1.8rem;line-height:1.2}
  .node b{display:block;font-size:.88rem;color:var(--c)}
  .node small{display:block;font-size:.72rem;color:var(--sub);line-height:1.35}
  .pkt{position:absolute;z-index:5;left:0;top:0;transform:translate(-50%,-50%);background:var(--pkt);color:#fff;font-size:.78rem;padding:4px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;pointer-events:none}
  .pkt.show{opacity:1}
  .pkt.back{background:var(--ok)}
  .pkt.err{background:var(--err)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .say{border-left:6px solid var(--pkt);background:color-mix(in srgb,var(--pkt) 8%,transparent);border-radius:0 12px 12px 0;padding:12px 16px;min-height:150px}
  .say.err{border-color:var(--err);background:color-mix(in srgb,var(--err) 8%,transparent)}
  .say h3{font-size:1rem;margin-bottom:4px}
  .say p{font-size:.93rem}
  .say pre{margin-top:10px;background:var(--code);color:var(--codeink);padding:10px 12px;border-radius:10px;font:12.5px/1.55 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .codebox{background:var(--code);color:var(--codeink);border-radius:12px;padding:8px 0;font:12.5px/1.6 Consolas,monospace;max-height:320px;overflow:auto}
  .codebox .t{padding:0 14px 6px;color:#7f93a7;font-size:.75rem}
  .ln{display:block;padding:0 14px;white-space:pre;border-left:4px solid transparent}
  .ln i{color:#5d7186;font-style:normal;display:inline-block;width:2.2em;user-select:none}
  .ln.hl{background:var(--hl);border-left-color:#4da3ff;color:#fff}
  .codebox.dim{opacity:.55}

  .ctrl{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .btn{background:#2f80ed;color:#fff;border:0;padding:9px 18px;border-radius:22px;font:inherit;cursor:pointer}
  .btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
  .dot.on{background:var(--pkt)}
  .note{margin-top:22px;font-size:.88rem;color:var(--sub)}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ main.py 한 줄 한 줄 — 동작 원리</h1>
  <p class="lead">아래 단계 버튼을 누르면 <b>실제 main.py의 어느 줄</b>이 실행되는지 파란색으로 표시됩니다. 주황 말풍선은 지금 움직이는 "데이터"예요.</p>

  <div class="tabs" id="tabs"></div>

    <div class="stage" id="stage"><div class="pkt" id="pkt"></div></div>

      <div class="say" id="say"></div>
      <div class="codebox" id="code"></div>

      <button class="btn g" id="auto">▶ 자동 재생</button>
      <div class="dots" id="dots"></div>
    </div>

  <p class="note">※ 오른쪽 코드는 <code>my_api/main.py</code> 그대로입니다. Supabase·Railway 내부 설명(5, 6번 탭)은 코드가 아니라 서비스가 하는 일을 설명한 것이라 코드 대신 관련 줄만 표시돼요.</p>
</div>

const CODE = `import os

from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from dotenv import load_dotenv
from supabase import create_client

load_dotenv()

# 로컬에선 .env를 읽고, Railway에선 Variables가 이미 들어 있음
SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_SECRET_KEY = os.environ["SUPABASE_SECRET_KEY"]
FRONT_ORIGINS = [
    o.strip() for o in os.getenv("FRONT_ORIGINS", "").split(",") if o.strip()
]

sb = create_client(SUPABASE_URL, SUPABASE_SECRET_KEY)

app = FastAPI(title="my-api")

app.add_middleware(
    CORSMiddleware,
    allow_origins=FRONT_ORIGINS,
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


@app.get("/health")
def health():
    return {"status": "ok"}


class ItemIn(BaseModel):
    name: str


@app.get("/items")
def list_items():
    try:
        res = sb.table("items").select("*").order("id", desc=True).limit(50).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"Supabase 오류: {e}")
    return res.data


@app.post("/items")
def create_item(item: ItemIn):
    try:
        res = sb.table("items").insert({"name": item.name}).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"Supabase 오류: {e}")
    return res.data[0]`.split("\n");

   text:"<code>Origin: http://localhost:5500</code>이 FRONT_ORIGINS(.env에서 읽은 목록)에 있는지 봅니다. 있으면 통과하고 응답에 허용 도장(Access-Control-Allow-Origin)을 찍을 준비를 해요. 없으면 서버는 일을 해도 <b>브라우저가 결과를 화면에 못 쓰게 막습니다.</b>"},
  {f:3,t:4,pkt:"item.name='사과'",hl:[[36,37],[49,50]],title:"④ 경로표에서 함수 찾기 + 내용 검사(Pydantic)",
   text:"'POST + /items' 를 경로표에서 찾으면 49줄의 <code>create_item</code>이 나옵니다. 그 전에 본문 JSON이 <code>ItemIn</code>(name은 글자여야 함)에 맞는지 검사해요. 통과하면 <b>item.name = '사과'</b> 를 들고 함수가 실행됩니다. (맞지 않으면 → 3번 탭)"},

   text:"<code>sb.table('items').insert({...})</code>는 '문장 조립'이에요. <code>.execute()</code>가 불리는 순간 비로소 인터넷으로 보냅니다. 전체를 <code>try</code>로 감싼 이유: 창고가 에러를 내도 서버가 죽지 않고 정리된 에러를 돌려주려고요."},

  {f:2,t:0,back:1,pkt:"200 OK + JSON",hl:[],title:"⑩ 브라우저에 응답 도착 → 화면이 목록을 새로고침",

   data:`HTTP/1.1 200 OK
access-control-allow-origin: http://localhost:5500
content-type: application/json

{"id":1,"name":"사과","created_at":"..."}`},
];
const S2b = [

S2b[0].data = `POST /items HTTP/1.1
Content-Type: application/json

{}        ← name 이 빠졌어요!`;
S2b[0].title = "① 이름 없이 주문이 들어왔다 (name 누락)";
S2b[0].text = "화면에서 이름을 안 적고 보냈다고 가정해 볼게요. 본문이 <code>{}</code> 이에요.";
S2b[3] = {f:3,t:0,err:1,back:1,pkt:"422 거절",hl:[[36,37],[49,50]],title:"④ 검사에서 탈락 → 함수는 실행조차 안 된다",
  text:"<code>ItemIn</code>은 'name: str 필수'라고 선언돼 있어서 본문에 name 이 없으면 <b>create_item() 한 줄도 실행되지 않고</b> 곧바로 422(내용이 이상해요)로 돌려보내요. Supabase에도 가지 않습니다. 이 검사는 우리가 코드를 짜지 않아도 <code>name: str</code> 한 줄이 해 주는 FastAPI의 핵심 기능이에요.",

const S2c = [
  ...S2.slice(0,6).map(s=>({...s})),
  {f:6,t:5,back:1,err:1,pkt:"404 PGRST205",hl:[],title:"⑦ Supabase: '그런 표(table)는 없어요'",

const N1 = [

const CHAPS = [
  {name:"1. 서버가 켜질 때",nodes:N1,steps:S1},
  {name:"2. 요청 따라가기 (저장)",nodes:N2,steps:S2},
  {name:"3. 실패① 내용이 이상할 때 (422)",nodes:N2,steps:S2b,e:1},
  {name:"4. 실패② 창고 문제 (500)",nodes:N2,steps:S2c,e:1},
  {name:"5. Supabase 안쪽",nodes:N5,steps:S5},
  {name:"6. Railway 배포",nodes:N6,steps:S6},
];

/* ───── 엔진 ───── */
let ch=0, st=-1, timer=null, raf=null, pos=null;
const stage=$("stage"), pkt=$("pkt");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function buildTabs(){
  $("tabs").innerHTML="";
  CHAPS.forEach((c,i)=>{const b=document.createElement("button");b.className="tab"+(c.e?" e":"");b.textContent=c.name;b.onclick=()=>selectChap(i);$("tabs").appendChild(b);});
}
function selectChap(i){
  ch=i; st=-1; stopAuto(); cancelAnimationFrame(raf); pos=null;
  [...$("tabs").children].forEach((b,j)=>b.classList.toggle("on",j===i));
  [...stage.querySelectorAll(".node")].forEach(n=>n.remove());
  CHAPS[i].nodes.forEach((n,k)=>{
    const d=document.createElement("div");d.className="node";d.style.setProperty("--c",n.c);d.id="n"+k;
    d.innerHTML=`<div class="i">${n.i}</div><b>${n.n}</b><small>${n.s}</small>`;stage.appendChild(d);
  });
  $("dots").innerHTML=CHAPS[i].steps.map((_,k)=>`<span class="dot" data-k="${k}"></span>`).join("");
  [...$("dots").children].forEach(d=>d.onclick=()=>{stopAuto();show(+d.dataset.k);});
  pkt.classList.remove("show");
  renderCode([]);
  $("say").className="say";
  $("say").innerHTML="<h3>▶ '다음 단계'를 눌러 시작하세요</h3><p>"+CHAPS[i].name+" — 총 "+CHAPS[i].steps.length+"단계</p>";
}
function renderCode(hl){
  const set=new Set();hl.forEach(([a,b])=>{for(let k=a;k<=b;k++)set.add(k);});
  const box=$("code");
  box.innerHTML='<div class="t">my_api/main.py</div>'+CODE.map((l,k)=>`<span class="ln${set.has(k+1)?" hl":""}"><i>${k+1}</i>${esc(l)||" "}</span>`).join("");
  box.classList.toggle("dim",hl.length===0);
  const first=box.querySelector(".hl");
  if(first) box.scrollTop=Math.max(0,first.offsetTop-box.offsetTop-60);
}
function center(k){const n=$("n"+k);return {x:n.offsetLeft+n.offsetWidth/2,y:n.offsetTop+n.offsetHeight/2};}

function show(i){
  const S=CHAPS[ch].steps; if(i<0||i>=S.length) return;
  st=i; const s=S[i];
  [...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k<=i));
  [...stage.querySelectorAll(".node")].forEach(n=>n.classList.remove("act","pulse"));
  $("say").className="say"+(s.err?" err":"");
  $("say").innerHTML=`<h3>${s.title}</h3><p>${s.text}</p>${s.data?"<pre>"+esc(s.data)+"</pre>":""}`;
  renderCode(s.hl||[]);
  const a=center(s.f), b=center(s.t);
  pkt.className="pkt"+(s.back?" back":"")+(s.err?" err":"");
  if(s.f===s.t){
    pkt.classList.remove("show"); $("n"+s.f).classList.add("pulse","act"); pos=null; return;
  }
  pkt.textContent=s.pkt;
  const start=pos&&Math.abs(pos.x-a.x)+Math.abs(pos.y-a.y)<4?pos:a;
  pkt.classList.add("show"); $("n"+s.f).classList.add("act");
  const t0=performance.now(),dur=1100;cancelAnimationFrame(raf);
  (function f(now){
    const t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    pos={x:start.x+(b.x-start.x)*e,y:start.y+(b.y-start.y)*e};
    pkt.style.left=pos.x+"px";pkt.style.top=pos.y+"px";
    if(t<1)raf=requestAnimationFrame(f);else{$("n"+s.t).classList.add("act");}
  })(t0);
}
function stopAuto(){clearInterval(timer);timer=null;$("auto").textContent="▶ 자동 재생";}
$("next").onclick=()=>{stopAuto();if(st+1<CHAPS[ch].steps.length)show(st+1);};
$("prev").onclick=()=>{stopAuto();if(st>0)show(st-1);};
$("auto").onclick=()=>{
  if(timer){stopAuto();return;}
  $("auto").textContent="⏸ 멈춤";
  if(st>=CHAPS[ch].steps.length-1)st=-1;
  show(st+1);
  timer=setInterval(()=>{ if(st+1>=CHAPS[ch].steps.length){stopAuto();return;} show(st+1); },4500);
};
addEventListener("resize",()=>{pos=null;});
buildTabs();selectChap(0);
</script>
